name: Daily News Fetch

# 北京时间 08:00 = UTC 00:00
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch, translate and build brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
        run: npm run news:pipeline

      - name: Sync AI HOT curated feed
        run: npm run aihot:fetch

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json data/news-db/ aihot-feed.json
          git diff --staged --quiet || git commit -m "chore: daily news brief $(date -u +%F)"
          git push
