<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>访问统计 · AI Bazaar Admin</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .admin-page { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
    .admin-card {
      margin-top: 20px;
      padding: 24px;
      border-radius: 18px;
      border: 1px solid rgba(229, 176, 177, 0.24);
      background: rgba(12, 12, 12, 0.92);
    }
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 16px 0 20px;
    }
    .admin-stat {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
    }
    .admin-stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .admin-stat-value { font-size: 24px; font-weight: 800; }
    .admin-form { display: grid; gap: 12px; max-width: 360px; }
    .admin-form input {
      width: 100%;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: inherit;
      font: inherit;
    }
    .admin-table-wrap { overflow-x: auto; margin-top: 16px; }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .admin-table th,
    .admin-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
      vertical-align: top;
    }
    .admin-table th { color: var(--muted); font-weight: 700; }
    .admin-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .admin-msg { margin-top: 12px; font-size: 13px; color: var(--muted); }
    .admin-msg.error { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"><div class="glow glow-a"></div><div class="glow glow-b"></div><div class="grain"></div></div>

  <main class="admin-page">
    <div class="page-intro">
      <div class="section-label">Owner Only</div>
      <h1>访问统计</h1>
      <p>仅登录账号可查看；公开站点访客无需登录。</p>
    </div>

    <section class="admin-card" id="loginPanel">
      <h2 style="margin:0 0 12px;font-size:18px;">登录</h2>
      <form class="admin-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="邮箱" autocomplete="username" required />
        <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password" required />
        <button class="btn btn-primary" type="submit">登录查看</button>
      </form>
      <p class="admin-msg" id="loginMsg"></p>
    </section>

    <section class="admin-card" id="dashboardPanel" hidden>
      <div class="admin-toolbar">
        <h2 style="margin:0;font-size:18px;">访问记录</h2>
        <button class="btn btn-ghost btn-sm" type="button" id="refreshBtn">刷新</button>
        <button class="btn btn-ghost btn-sm" type="button" id="logoutBtn">退出</button>
      </div>

      <div class="admin-stats" id="statsGrid"></div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>页面</th>
              <th>路径</th>
              <th>来源</th>
              <th>会话</th>
            </tr>
          </thead>
          <tbody id="visitsBody"></tbody>
        </table>
      </div>
      <p class="admin-msg" id="dashMsg"></p>
    </section>
  </main>

  <script src="./analytics-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
